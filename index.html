<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TERDINKEN | Turkish Kebab</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
    <style>
        /* ALTIN İMLEÇ */
        * { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="%23FFD700" stroke="white" stroke-width="2"/></svg>') 12 12, auto !important; }
        body { margin: 0; padding: 0; background: #000; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; font-family: 'Cinzel Decorative', cursive; position: relative; }
        
        /* SAMURAY GÖRSELİ */
        .bg-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('https://w0.peakpx.com/wallpaper/146/745/wallpaper-miyamoto-musashi-vagabond.jpg') no-repeat center center; background-size: cover; filter: grayscale(100%) brightness(30%) contrast(110%); z-index: 1; }
        
        /* KAR YAĞIŞI */
        #snow-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        
        /* TİTREME ANİMASYONU */
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
        
        /* ÜST YAZI */
        .header-arc { position: absolute; top: 8%; width: 100%; z-index: 999; text-align: center; pointer-events: none; }
        .header-arc h2 { font-size: 55px; color: rgba(255, 215, 0, 0.5); letter-spacing: 12px; text-transform: uppercase; margin: 0; text-shadow: 0 0 20px #000; }
        
        /* TABELA */
        .wooden-sign { z-index: 999; background: linear-gradient(145deg, #3d2616, #21130a); border: 4px solid #1a0f08; padding: 25px 80px; border-radius: 4px; box-shadow: 0 0 60px #000; transform: rotate(-1deg); text-align: center; transition: 0.2s; }
        .wooden-sign:hover { animation: shake 0.5s infinite; }
        .wooden-sign h1 { color: #DAA520; font-family: 'IM Fell English SC', serif; font-size: 85px; margin: 0; letter-spacing: 18px; text-shadow: 4px 4px 0px #000; }
        
        .controls { z-index: 999; display: flex; flex-direction: column; align-items: center; }
        .gold-btn { margin-top: 40px; padding: 16px 55px; background: transparent; color: #DAA520; border: 2px solid #DAA520; cursor: pointer; font-family: 'Cinzel Decorative', cursive; font-size: 20px; letter-spacing: 3px; transition: 0.3s; }
        .gold-btn:hover { animation: shake 0.5s infinite; background: #DAA520; color: #000; }
        
        .socials { margin-top: 30px; display: flex; gap: 30px; }
        .socials a { color: #DAA520; font-size: 38px; transition: 0.3s; }
        .socials a:hover { animation: shake 0.5s infinite; color: white; }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <canvas id="snow-canvas"></canvas>
    <audio id="bgMusic" loop><source src="https://archive.org/download/TheStranglersGoldenBrown/The%20Stranglers%20-%20Golden%20Brown.mp3" type="audio/mpeg"></audio>
    
    <div class="header-arc"><h2>TURKISH KEBAB</h2></div>
    <div class="wooden-sign"><h1>KEBAB</h1></div>
    
    <div class="controls">
        <button class="gold-btn" onclick="window.open('https://www.youtube.com/watch?v=I-MSviG32kE', '_blank')">ENTER KITCHEN 🔥</button>
        <div class="socials">
            <a href="#"><i class="fa-brands fa-discord"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-youtube"></i></a>
        </div>
    </div>

    <script>
        document.body.addEventListener('click', () => { document.getElementById('bgMusic').play(); }, { once: true });
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        let snowParticles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();
        class Snowflake {
            constructor() { this.reset(); }
            reset() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height - canvas.height; this.size = Math.random() * 3 + 1; this.speed = Math.random() * 1.5 + 0.5; this.opacity = Math.random() * 0.8 + 0.2; }
            update() { this.y += this.speed; if (this.y > canvas.height) this.reset(); }
            draw() { ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
        }
        for (let i = 0; i < 150; i++) snowParticles.push(new Snowflake());
        function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); snowParticles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
        animate();
    </script>
</body>
</html>
