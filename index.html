<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TERDINKEN | Turkish Kebab</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=IM+Fell+English+SC&display=swap" rel="stylesheet">

    <style>
        /* ALTIN İMLEÇ */
        * { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="%23FFD700" stroke="white" stroke-width="2"/></svg>') 12 12, auto !important; }

        body {
            margin: 0; padding: 0; background: #000;
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Cinzel Decorative', cursive;
            position: relative;
        }

        /* ARKA PLAN GÖRSELİ (SAMURAY) */
        .bg-image {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://w0.peakpx.com/wallpaper/146/745/wallpaper-miyamoto-musashi-vagabond.jpg') no-repeat center center;
            background-size: cover;
            filter: grayscale(100%) brightness(30%) contrast(110%);
            z-index: 1; /* En altta */
        }

        /* KAR YAĞIŞI */
        #snow-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; /* Görselin üstünde, yazıların altında */
            pointer-events: none;
        }

        /* TİTREME ANİMASYONU */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            25% { transform: translate(-2px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            75% { transform: translate(2px, 1px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* ÜST YAY YAZI - KESİN GÖRÜNÜR */
        .header-arc {
            position: absolute; top: 8%; width: 100%; z-index: 999;
            text-align: center; pointer-events: none;
        }
        .header-arc h2 {
            font-size: 55px; color: rgba(255, 215, 0, 0.4);
            letter-spacing: 12px; text-transform: uppercase; margin: 0;
            text-shadow: 0 0 20px rgba(0,0,0,1);
        }

        /* AHŞAP TABELA */
        .wooden-sign {
            z-index: 999;
            background: linear-gradient(145deg, #3d2616, #21130a);
            border: 4px solid #1a0f08;
            padding: 25px 80px;
            border-radius: 4px;
            box-shadow: 0 0 60px rgba(0,0,0,1);
            transform: rotate(-1deg);
            text-align: center;
            transition: 0.2s;
        }
